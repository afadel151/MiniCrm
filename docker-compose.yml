services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: minicrm_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MiniCrm2026"   
      MSSQL_PID: "Developer"                  
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql          
      - ./scripts/sql:/docker-entrypoint-initdb 
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "MiniCrm2026" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:
